name: Build & release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de version (ex. v1.0.1)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Doit satisfaire `environment: sdk: ^3.12.1` de pubspec.yaml.
          # Flutter 3.24 embarque Dart 3.5 : `flutter pub get` échouerait.
          flutter-version: "3.44.x"
          channel: stable

      - name: Install deps
        run: flutter pub get

      - name: Signer avec la cle de release (optionnel)
        # `android/app/build.gradle.kts` lit `android/key.properties` — c'est
        # le SEUL fichier qu'il consulte. Le décodage vers
        # `android/app/release.keystore` ne servait à rien : rien ne le lit,
        # et l'APK repartait signé en DEBUG.
        #
        # Secrets à définir dans Settings → Secrets and variables → Actions :
        #   ANDROID_KEYSTORE_BASE64  (base64 -w0 bym-upload.jks)
        #   ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
        #
        # Sans ces secrets, l'étape est sautée et le build annonce — dans sa
        # sortie — qu'il produit une version signée en debug. N'y ayez donc
        # pas foi : vérifiez la signature avant de diffuser.
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          KEYSTORE="$GITHUB_WORKSPACE/android/upload.keystore"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE"
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$KEYSTORE
          EOF

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Verifier la signature produite
        # Le build ne bloque jamais sur une cle absente : il prévient et
        # signe en DEBUG. Ce step rend la signature VISIBLE dans le log, pour
        # qu'elle ne puisse pas être confondue avec celle d'une release.
        run: |
          echo "*** Signer de l'APK produit :"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk | grep "DN:" || true
          echo "*** Un DN 'CN=Android Debug' signe une version NON publiable."

      - name: Tag utilisé
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer l'asset
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          cp build/app/outputs/flutter-apk/app-release.apk "bym-${TAG}.apk"
          echo "ASSET=bym-${TAG}.apk" >> "$GITHUB_ENV"

      - name: Publier la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: BYM ${{ steps.tag.outputs.name }}
          body: |
            Version ${{ steps.tag.outputs.name }} de BYM — Bible de Yehoshoua Ha Mashiah.
            Voir la page de présentation pour les nouveautés.
          files: ${{ env.ASSET }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
